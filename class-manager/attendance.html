<main id="main"><div class="wrap">
<style>
.host{max-width:46rem;margin:0 auto}
.host .panel{background:var(--surface);border:1px solid var(--border);border-top:5px solid var(--brown-edge);border-radius:8px;padding:1.2rem 1.4rem;box-shadow:var(--shadow);margin-bottom:1rem}
.host label{display:block;font:600 .95rem system-ui,sans-serif;margin:.6rem 0 .25rem}
.host input[type=password],.host input[type=text]{width:100%;max-width:22rem;min-height:44px;padding:.4rem .6rem;border:1.5px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font:1rem system-ui,sans-serif}
.host .go{min-height:48px;padding:.5rem 1.4rem;border:2px solid var(--brown-fill);border-radius:6px;background:var(--brown-fill);color:#fff;font:600 1.05rem system-ui,sans-serif;cursor:pointer;margin:.3rem .4rem 0 0;text-decoration:none;display:inline-block}
.host .go.alt{background:var(--btn-bg);color:var(--btn-text)}
.host .go.big{min-height:64px;font-size:1.3rem;padding:.7rem 1.8rem}
.host .choices{display:flex;flex-wrap:wrap;gap:1rem}
.host .choices .go{flex:1 1 14rem;text-align:center;min-height:96px;font-size:1.4rem;display:flex;align-items:center;justify-content:center}
.host .note{font:.92rem/1.5 system-ui,sans-serif;color:var(--muted)}
.host [hidden]{display:none!important}
body.focus header.banner,body.focus nav.jump,body.focus .crumb,body.focus .sec-sub,body.focus aside.disclaimer,body.focus footer,body.focus a.skip,body.focus main h2{display:none!important}
body.focus main{padding-top:1rem}
</style>
<style>
.host.att{max-width:60rem;text-align:center}
.att .qr{width:min(340px,70vw);height:min(340px,70vw);background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px}
.att .code{font:700 clamp(4rem,16vw,9rem)/1.05 ui-monospace,Menlo,monospace;letter-spacing:.08em;color:var(--brown);margin:.2rem 0}
@media (prefers-color-scheme:dark){.att .code{color:#e9c9a8}}
.att .addr{font:1.3rem ui-monospace,Menlo,monospace;margin:.4rem 0}
.att .count{font:700 1.6rem system-ui,sans-serif;margin:.6rem 0}
.att .lbl{font:600 1rem system-ui,sans-serif;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0}
.att input.codein{text-align:center;font:700 2.4rem ui-monospace,Menlo,monospace;max-width:12rem;letter-spacing:.1em}
.att .toplinks{text-align:left;margin:0 0 .6rem}
</style>
<div class="host att">
 <p class="toplinks"><a href="lecturer.html">&larr; Lecturer menu</a></p>
 <section class="panel" id="a-login" hidden>
  <h3 style="margin:.1rem 0 .4rem">Lecturer login</h3>
  <form id="a-form" autocomplete="off">
   <label for="a-key">Key</label><input type="password" id="a-key" maxlength="40" autocomplete="new-password" autocapitalize="none" spellcheck="false">
   <p><button class="go" type="submit">Log in</button></p>
   <p class="note" id="a-err" role="alert" hidden></p>
  </form>
 </section>
 <section class="panel" id="a-idle" hidden>
  <h3 style="margin:.1rem 0 .6rem">Attendance</h3>
  <p class="note"><label for="a-rad">Distance from this device that still counts as in class</label>
   <select id="a-rad"><option value="250">250 m</option><option value="500" selected>500 m (default)</option><option value="1000">1 km</option><option value="2000">2 km</option></select></p>
  <p><button class="go big" type="button" id="a-start">Start attendance</button></p>
  <p class="note" id="a-last"></p>
 </section>
 <section class="panel" id="a-live" hidden>
  <p class="lbl">Scan this screen with your phone and enter your student ID. Your phone must be in the classroom.</p>
  <p><span id="a-qr" class="qr" role="img" aria-label="QR code to open the check-in page; it changes every 30 seconds" style="display:inline-block"></span></p>
  <p class="note" id="a-tick" role="status"></p>
  <p class="count" id="a-count" role="status"></p>
  <p><button class="go big" type="button" id="a-close">Close attendance and record absences</button></p>
  <p class="note" id="a-msg" role="status"></p>
 </section>
 <p><button class="go alt" type="button" id="a-out">Log out</button></p>
</div>
<script src="assets/qrcode.js"></script>
<script>
(function(){
"use strict";
var SCRIPT_URL=window.CM.scriptUrl;
var $=function(i){return document.getElementById(i)};
function jsonp(params,cb){
 var n="cb"+Date.now()+Math.floor(Math.random()*1e6),sc=document.createElement("script"),done=false;
 function end(d){if(done)return;done=true;delete window[n];if(sc.parentNode)sc.parentNode.removeChild(sc);cb(d)}
 window[n]=end;sc.onerror=function(){end(null)};
 sc.src=SCRIPT_URL+"?"+params+"&callback="+n+"&_="+Date.now();document.head.appendChild(sc);
}
var KEY="";try{KEY=sessionStorage.getItem("cm_hk")||""}catch(x){}
function saveKey(k){KEY=k;try{sessionStorage.setItem("cm_hk",k)}catch(x){}}
function signOut(){KEY="";try{sessionStorage.removeItem("cm_hk")}catch(x){}location.href="lecturer.html"}

try{var sr=localStorage.getItem("cm_rad");if(sr)setTimeout(function(){var e=$("a-rad");if(e&&e.querySelector('option[value="'+sr+'"]'))e.value=sr},0)}catch(x){}
var timer=null,tk=null,left=0,stamp=0,show=function(id){["a-login","a-idle","a-live"].forEach(function(x){$(x).hidden=(x!==id)})};
function call(act,extra,cb){jsonp("action="+act+"&hostkey="+encodeURIComponent(KEY)+(extra||""),cb)}
function draw(d){
 var ss=d&&d.session,open=ss&&ss.status==="Open";
 if(open){
  drawQr(ss.link);left=ss.secondsLeft||0;stamp=Date.now();tickDraw();if(!tk)tk=setInterval(tickDraw,1000);
  $("a-count").textContent=ss.present+" present"+(ss.notOnList?", "+ss.notOnList+" not on the list":"");
  show("a-live");if(!timer)timer=setInterval(poll,4000);
 } else {
  if(timer){clearInterval(timer);timer=null}if(tk){clearInterval(tk);tk=null}
  show("a-idle");
 }
}
var lastLink="";
function drawQr(t){
 if(!t){lastLink="";$("a-qr").innerHTML='<span style="display:block;padding:1.2rem;color:#b3261e;font:700 1.1rem/1.4 system-ui,sans-serif;text-align:left">No QR token received from the Apps Script. The deployed script is the old version. Paste the new quiz_receiver.gs, Save, then Deploy &gt; Manage deployments &gt; edit &gt; New version, and reload this page.</span>';return}
 if(t===lastLink)return;lastLink=t;
 try{var q=qrcode(0,"M");q.addData(CM.pageUrl("attend.html")+"?t="+t);q.make();
  $("a-qr").innerHTML=q.createSvgTag({cellSize:8,margin:0,scalable:true});
  var s=$("a-qr").firstChild;if(s){s.setAttribute("width","100%");s.setAttribute("height","100%")}}catch(x){lastLink="";$("a-qr").innerHTML='<span style="display:block;padding:1.2rem;color:#b3261e;font:700 1.1rem/1.4 system-ui,sans-serif">The QR code could not be drawn ('+String(x&&x.message||x).replace(/</g,"")+'). Reload the page; if it persists, check that assets/qrcode.js loads.</span>'}
}
function tickDraw(){
 var r=left-Math.floor((Date.now()-stamp)/1000);
 $("a-tick").textContent=left?"The QR code changes in "+Math.max(r,0)+" s":"";
 if(left&&r<=0){left=0;poll()}
}
function poll(){call("attend_status","",function(d){if(d&&d.ok)draw(d)})}
function begin(){
 if(!KEY){show("a-login");return}
 call("attend_status","",function(d){
  if(!d||!d.ok){try{sessionStorage.removeItem("cm_hk")}catch(x){}KEY="";show("a-login");if(d)$("a-err").textContent="";return}
  var ss=d.session;
  if(ss&&ss.status!=="Open")$("a-last").textContent="Last session "+ss.label+": "+ss.present+" present"+(ss.notOnList?", "+ss.notOnList+" not on the list":"")+".";
  draw(d);
 });
}
$("a-form").addEventListener("submit",function(e){
 e.preventDefault();var k=$("a-key").value.trim();if(!k){$("a-err").textContent="Enter the key.";$("a-err").hidden=false;return}
 jsonp("action=hostcheck&hostkey="+encodeURIComponent(k),function(d){
  if(d&&d.ok){saveKey(k);$("a-err").hidden=true;begin()}
  else{$("a-err").textContent=d?"That key was not accepted.":"Could not reach the class sheet. Check the connection.";$("a-err").hidden=false}
 });
});
$("a-start").addEventListener("click",function(){
 $("a-start").disabled=true;$("a-last").textContent="Getting the classroom location...";
 var go=function(extra,note){
 $("a-last").textContent="Starting...";
 call("attend_open",extra,function(d){ // the sheet makes a new random code each time, never one used before
  $("a-start").disabled=false;
  if(!d){$("a-last").textContent="Could not reach the class sheet. Try again.";return}
  if(!d.ok){$("a-last").textContent="Not started: "+(d.why||"refused")+".";return}
  $("a-msg").textContent=note||(d.session&&d.session.geo&&d.session.geo!=="off"?"Location check on ("+d.session.geo+", "+d.session.radius+" m).":"");draw(d);
 });
 };
 // The browser asks once for this device's location; students are compared with it. Without it, only a confirmed "start without" opens a session, and then nobody is checked by location.
 var noLoc=function(why){
  if(window.confirm(why+"\n\nStart WITHOUT the location check? Then anyone with the link and code could check in from anywhere. Press Cancel to stop, allow location for this page, and try again.")){go("&nogeo=1","Started without the location check.")}
  else{$("a-start").disabled=false;$("a-last").textContent="Not started: allow location for this page and try again."}
 };
 if(!navigator.geolocation){noLoc("This device cannot give a location.");return}
 navigator.geolocation.getCurrentPosition(function(p){
  try{localStorage.setItem("cm_rad",$("a-rad").value)}catch(x){}
  go("&lat="+p.coords.latitude.toFixed(5)+"&lon="+p.coords.longitude.toFixed(5)+"&radius="+encodeURIComponent($("a-rad").value),p.coords.accuracy>100?"This device's location is rough (about "+Math.round(p.coords.accuracy)+" m); the radius is widened by that much for the check. Try a student's phone at the back of the room.":"");
 },function(){noLoc("Location was not allowed or could not be found.")},{enableHighAccuracy:true,timeout:15000,maximumAge:0});
});
$("a-close").addEventListener("click",function(){
 if(!window.confirm("Close attendance? Check-ins stay held and are not recorded in the Attendance sheet until you press Submit attendance in the Control Centre."))return;
 $("a-msg").textContent="Closing...";
 call("attend_close","",function(d){
  if(!d||!d.ok){$("a-msg").textContent="Not closed: "+((d&&d.why)||"could not reach the class sheet")+".";return}
  var x=d.session;$("a-last").textContent="Closed and held, not yet recorded. Submit it from the Control Centre. "+x.present+" present, "+x.absent+" absent"+(x.notOnList?", "+x.notOnList+" not on the roster (see the Not_On_List tab)":"")+"."+(x.flagged?" "+x.flagged+" device(s) checked in more than one ID: see the Attendance_Flags tab.":"");
  if(timer){clearInterval(timer);timer=null}show("a-idle");
 });
});
$("a-out").addEventListener("click",signOut);
begin();
})();
</script>
</div>
