<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t d">
<title id="t">How nuclear physics leads to data science for physics</title>
<desc id="d">Nuclear Physics leads to Computational Research. Computational Research branches into Scientific Computing, Uncertainty Quantification and Data Analysis. Scientific Computing branches into Machine Learning, Data and Engineering.</desc>
<style>
.bg{fill:#17233a}.box{fill:#1A2645;stroke:#D6B07C}.top{fill:#2A3F73;stroke:#D6B07C}.t{fill:#F4F1EA;font:600 14px system-ui,sans-serif}.s{fill:#D7DDE8;font:13px system-ui,sans-serif}.l{stroke:#D6B07C;fill:none;stroke-width:1.5}
</style>
