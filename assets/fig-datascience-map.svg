<rect class="top" x="260" y="16" width="200" height="38" rx="8"/><text class="t" x="360" y="40" text-anchor="middle">Nuclear Physics</text>
<path class="l" d="M360 54V80"/>
<rect class="top" x="240" y="80" width="240" height="38" rx="8"/><text class="t" x="360" y="104" text-anchor="middle">Computational Research</text>
<path class="l" d="M360 118V138M160 138H615M160 138V158M400 138V158M615 138V158"/>
<rect class="box" x="60" y="158" width="200" height="38" rx="8"/><text class="t" x="160" y="182" text-anchor="middle">Scientific Computing</text>
<rect class="box" x="290" y="158" width="220" height="38" rx="8"/><text class="t" x="400" y="182" text-anchor="middle">Uncertainty Quantification</text>
<rect class="box" x="540" y="158" width="150" height="38" rx="8"/><text class="t" x="615" y="182" text-anchor="middle">Data Analysis</text>
<path class="l" d="M160 196V224M75 224H355M75 224V244M215 224V244M355 224V244"/>
<rect class="box" x="10" y="244" width="130" height="38" rx="8"/><text class="t" x="75" y="268" text-anchor="middle">Machine Learning</text>
<rect class="box" x="150" y="244" width="130" height="38" rx="8"/><text class="t" x="215" y="268" text-anchor="middle">Data</text>
<rect class="box" x="290" y="244" width="130" height="38" rx="8"/><text class="t" x="355" y="268" text-anchor="middle">Engineering</text>
<text class="s" x="360" y="318" text-anchor="middle">Methods built for nuclear reaction problems, then carried to other fields</text>
