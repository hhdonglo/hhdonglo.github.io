# Pages CMS configuration (https://pagescms.org). Sign in with GitHub; only people with write access to this repository can edit.
# Each entry below is a form for one data file. See EDITING.md.
media:
- name: lectures
  label: Lecture files (PHYS 143)
  input: PHYS143
  output: /PHYS143
- name: uncertainty
  label: Uncertainty lecture files (PHYS 105)
  input: PHYS105
  output: /PHYS105
- name: cv
  label: CV
  input: cv
  output: /cv
- name: images
  label: Images
  input: assets
  output: /assets
content:
- name: home
  label: Home
  type: file
  path: data/pages/home.json
  format: json
  fields:
  - name: hero_line1
    label: Header title, first line
    type: string
  - name: hero_line2
    label: Header title, second line (**bold** gives the highlighted accent)
    type: string
  - name: eyebrow
    label: Name
    type: string
  - name: role
    label: Position line
    type: string
  - name: statement
    label: Research statement (physics only)
    type: text
  - name: side_links
    label: Extra links under the photo (profile links come from Site settings)
    type: object
    fields:
    - name: label
      label: Text
      type: string
    - name: url
      label: Link
      type: string
    list: true
  - name: intro_paragraphs
    label: Introduction (two paragraphs)
    type: text
    list: true
  - name: blocks
    label: Menu dropdown lists (Research, Teaching, Projects, Data Science ML and Engineering, Students, Publications); the
      Title link must match the menu item address
    type: object
    fields:
    - name: title
      label: Title
      type: string
    - name: url
      label: Title link
      type: string
    - name: links
      label: Links in the block
      type: object
      fields:
      - name: label
        label: Text
        type: string
      - name: url
        label: Link
        type: string
      list: true
    list: true
  - name: highlights
    label: Research cards (three)
    type: object
    fields:
    - name: figure
      label: Animated figure (type fusion, or leave empty)
      type: string
    - name: figure_alt
      label: Figure description for screen readers
      type: text
    - name: title
      label: Title
      type: string
    - name: text
      label: Text
      type: text
    - name: button
      label: Button text
      type: string
    - name: url
      label: Button link
      type: string
    list: true
  - name: highlights_title
    label: Research heading
    type: string
  - name: technical_title
    label: Scientific Computing, Data Science and Engineering heading
    type: string
  - name: technical_text
    label: Scientific Computing, Data Science and Engineering text
    type: text
  - name: technical_button
    label: Scientific Computing, Data Science and Engineering button
    type: object
    fields:
    - name: label
      label: Text
      type: string
    - name: url
      label: Link
      type: string
  - name: affiliation
    label: Affiliation line under the position
    type: string
  - name: stats_title
    label: At a Glance heading
    type: string
  - name: stats
    label: At a Glance items
    type: object
    fields:
    - name: source
      label: Count automatically (lectures = lectures marked available, projects = Data Science, ML and Engineering projects;
        leave empty for a fixed number)
      type: string
    - name: value
      label: Fixed number (whole number, counts up; leave empty with no source for a text-only item)
      type: string
    - name: suffix
      label: Suffix (for example +)
      type: string
    - name: label
      label: Label
      type: string
    list: true
  - name: soon
    label: Coming-soon strip (links to the Upcoming card)
    type: object
    fields:
    - name: status
      label: Marker
      type: string
    - name: name
      label: Name
      type: string
    - name: tagline
      label: One-line purpose
      type: string
    - name: link_text
      label: Link text
      type: string
    - name: url
      label: Link (for example data-engineering.html#upcoming)
      type: string
  - name: cta
    label: Call to action
    type: object
    fields:
    - name: title
      label: Title
      type: string
    - name: text
      label: Text
      type: text
    - name: buttons
      label: Buttons
      type: object
      fields:
      - name: label
        label: Text
        type: string
      - name: url
        label: Link
        type: string
      list: true
  - name: working_title
    label: Heading of the Currently Working On block
    type: string
  - name: working
    label: Currently Working On (three items)
    type: object
    fields:
    - name: title
      label: Title
      type: string
    - name: text
      label: Text
      type: text
    - name: url
      label: Link
      type: string
    - name: link
      label: Link text
      type: string
    list: true
  - name: teaching_block
    label: Teaching block (clear the title to hide it)
    type: object
    fields:
    - name: title
      label: Heading
      type: string
    - name: text
      label: Text
      type: text
    - name: list_intro
      label: Line before the list
      type: string
    - name: items
      label: Teaching resources list
      type: string
      list: true
    - name: button
      label: Button
      type: object
      fields:
      - name: label
        label: Text
        type: string
      - name: url
        label: Link
        type: string
  - name: academic
    label: Academic Profile (clear the title to hide it)
    type: object
    fields:
    - name: title
      label: Heading
      type: string
    - name: paragraphs
      label: Paragraphs
      type: text
      list: true
    - name: button
      label: Button
      type: object
      fields:
      - name: label
        label: Text
        type: string
      - name: url
        label: Link
        type: string
  - name: publications_heading
    label: Selected Publications heading
    type: string
  - name: publications_link_label
    label: Link text to the Publications page
    type: string
- name: research
  label: Research
  type: file
  path: data/research.json
  format: json
  fields:
  - name: overview_title
    label: Overview heading
    type: string
  - name: question
    label: Opening question
    type: string
  - name: intro
    label: Introduction
    type: text
  - name: areas
    label: Research areas (numbered automatically)
    type: object
    fields:
    - name: id
      label: Anchor id (used by homepage links)
      type: string
    - name: title
      label: Title
      type: string
    - name: text
      label: Description (shown when there is no equation)
      type: text
    - name: link
      label: Link to a page (optional, makes the card clickable)
      type: string
    - name: link_label
      label: Link text (default Read more)
      type: string
    - name: equation
      label: Equation shown on the card, as LaTeX (optional; replaces the description)
      type: text
    list: true
  - name: current
    label: Current research
    type: object
    fields:
    - name: status
      label: Status label
      type: string
    - name: chip
      label: Short name for the home page
      type: string
    - name: title
      label: Title
      type: string
    - name: paragraphs
      label: Paragraphs
      type: text
      list: true
    list: true
  - name: previous
    label: Previous research
    type: object
    fields:
    - name: status
      label: Label
      type: string
    - name: title
      label: Title
      type: string
    - name: paragraphs
      label: Paragraphs
      type: text
      list: true
    list: true
  - name: publications_title
    label: Publications heading
    type: string
  - name: publications_text
    label: Publications text
    type: text
  - name: publications_link_label
    label: Publications button text
    type: string
- name: teaching
  label: Teaching
  type: file
  path: data/pages/teaching.json
  format: json
  fields:
  - name: title
    label: Page title
    type: string
  - name: subtitle
    label: Subtitle under the title
    type: string
  - name: sections
    label: Sections
    type: object
    fields: &id002
    - name: id
      label: Anchor id (optional)
      type: string
    - name: heading
      label: Heading
      type: string
    - name: subtitle
      label: Subtitle
      type: string
    - name: fold
      label: Show as a collapsible section
      type: boolean
    - name: layout
      label: Layout
      type: select
      options:
        values:
        - grid
        - stack
    - name: bullets
      label: Bullet list
      type: string
      list: true
    - name: bullet_style
      label: List style
      type: select
      options:
        values: &id001
        - list
        - chips
        - timeline
        - arrows
        - numbered
    - name: cards
      label: Cards
      type: object
      fields:
      - name: id
        label: Anchor id (optional)
        type: string
      - name: style
        label: Card style
        type: select
        options:
          values:
          - plain
          - wide
          - primary
          - secondary
          - course
          - lecture
      - name: kicker
        label: Small label above the title
        type: string
      - name: title
        label: Title
        type: string
      - name: subtitle
        label: Subtitle
        type: string
      - name: paragraphs
        label: Paragraphs
        type: text
        list: true
      - name: lead
        label: Larger lead text
        type: boolean
      - name: bullets
        label: Bullet list
        type: string
        list: true
      - name: bullet_style
        label: List style
        type: select
        options:
          values: *id001
      - name: note_top
        label: Note above the list
        type: string
      - name: note
        label: Note at the end
        type: string
      - name: after
        label: Paragraphs after the list
        type: text
        list: true
      - name: subsections
        label: Subsections
        type: object
        fields:
        - name: title
          label: Title
          type: string
        - name: style
          label: Style
          type: select
          options:
            values:
            - inline
            - boxed
            - bold
        - name: column
          label: Column (1 or 2, only for two-column cards)
          type: number
        - name: paragraphs
          label: Paragraphs
          type: text
          list: true
        - name: bullets
          label: Bullet list
          type: string
          list: true
        - name: bullet_style
          label: List style
          type: select
          options:
            values: *id001
        list: true
      - name: table
        label: Table
        type: object
        fields:
        - name: caption
          label: Caption
          type: string
        - name: headers
          label: Column headings
          type: string
          list: true
        - name: rows
          label: Rows
          type: object
          fields:
          - name: cells
            label: Cells
            type: string
            list: true
          list: true
      - name: special
        label: Fills itself from Site settings
        type: select
        options:
          values:
          - profiles
          - details
      - name: button_label
        label: Button text
        type: string
      - name: button_url
        label: Button link
        type: string
      - name: button_style
        label: Button style (primary, or blank)
        type: string
      - name: button_sr
        label: Hidden text for screen readers
        type: string
      - name: soon
        label: Mark as coming soon
        type: boolean
      - name: badge
        label: Badge text
        type: string
      - name: image
        label: Image path
        type: string
      - name: image_alt
        label: Image description
        type: string
      - name: image_url
        label: Image link
        type: string
      - name: steps
        label: Steps
        type: string
        list: true
      list: true
    list: true
- name: phys143
  label: 'Teaching: PHYS 143 page'
  type: file
  path: data/pages/phys143.json
  format: json
  fields:
  - name: title
    label: Page title
    type: string
  - name: subtitle
    label: Subtitle under the title
    type: string
  - name: top
    label: Sections above the lecture tables
    type: object
    fields: *id002
    list: true
  - name: bottom
    label: Sections below the lecture tables
    type: object
    fields: *id002
    list: true
- name: lectures
  label: 'Teaching: PHYS 143 lectures'
  type: file
  path: data/lectures.json
  format: json
  fields:
  - name: course_title
    label: Course name
    type: string
  - name: official_listing
    label: Official course listing (web page link)
    type: object
    fields:
    - name: label
      label: Link text
      type: string
    - name: url
      label: Web address (opens in a new tab)
      type: string
  - name: course_outline
    label: Course outline or syllabus (PDF)
    type: object
    fields:
    - name: label
      label: Label
      type: string
    - name: url
      label: PDF path, for example PHYS143/course_outline.pdf (leave empty until the file is uploaded; Preview and Download
        appear automatically)
      type: string
  - name: contacts
    label: The three contacts (shown on every lecture page)
    type: object
    fields:
    - name: heading
      label: Heading
      type: string
    - name: purpose
      label: Purpose
      type: string
    list: true
  - name: groups
    label: Groups
    type: object
    fields:
    - name: id
      label: Group id (mechanics or thermal)
      type: string
    - name: title
      label: Title
      type: string
    - name: subtitle
      label: Subtitle
      type: string
    - name: lectures
      label: Lectures
      type: object
      fields:
      - name: number
        label: Lecture number
        type: number
      - name: title
        label: Title
        type: string
      - name: status
        label: Status
        type: select
        options:
          values:
          - available
          - soon
      - name: summary
        label: One-sentence summary
        type: text
      - name: note
        label: Note shown when coming soon
        type: string
      - name: outcomes
        label: Learning outcomes
        type: string
        list: true
      - name: slides
        label: 'Button: Open lecture slides (PDF path; leave empty for Coming soon)'
        type: string
      - name: tutorial
        label: 'Button: Tutorial (PDF path; leave empty for Coming soon)'
        type: string
      - name: supplement
        label: 'Button: Supplementary (PDF path; leave empty for Coming soon)'
        type: string
      - name: practice
        label: 'Button: Practice questions'
        type: select
        options:
          values:
          - available
          - soon
      - name: contact_focus
        label: Focus words for contacts 1, 2 and 3
        type: string
        list: true
      list: true
    list: true
- name: quizzes
  label: 'Teaching: practice questions'
  type: collection
  path: quizzes
  format: json
  fields:
  - name: lecture
    label: Lecture number
    type: number
  - name: title
    label: Lecture title
    type: string
  - name: questions
    label: Questions
    type: object
    fields:
    - name: id
      label: Question id
      type: string
    - name: type
      label: Type
      type: select
      options:
        values:
        - concept
        - calc
        - misconception
    - name: q
      label: Question
      type: text
    - name: options
      label: Answer options
      type: string
      list: true
    - name: answer
      label: Correct option (0 = first, 1 = second, ...)
      type: number
    - name: exp
      label: Explanation
      type: text
    - name: ref
      label: Where to look
      type: string
    list: true
  view:
    fields:
    - title
    primary: title
- name: laboratory
  label: 'Teaching: Laboratory courses'
  type: file
  path: data/pages/laboratory.json
  format: json
  fields:
  - name: title
    label: Page title
    type: string
  - name: subtitle
    label: Subtitle under the title
    type: string
  - name: sections
    label: Sections
    type: object
    fields: *id002
    list: true
- name: student-research
  label: Students
  type: file
  path: data/pages/student-research.json
  format: json
  fields:
  - name: title
    label: Page title
    type: string
  - name: subtitle
    label: Subtitle under the title
    type: string
  - name: sections
    label: Sections
    type: object
    fields: *id002
    list: true
- name: superheavy
  label: Superheavy elements page
  type: file
  path: data/superheavy.json
  format: json
  fields:
  - name: title
    label: Page title
    type: string
  - name: subtitle
    label: Subtitle
    type: text
  - name: intro
    label: Opening text
    type: text
  - name: sections
    label: Sections
    type: object
    fields:
    - name: id
      label: Anchor id
      type: string
    - name: heading
      label: Heading
      type: string
    - name: paragraphs
      label: Paragraphs (before the lists and equations)
      type: text
      list: true
    - name: steps
      label: Steps (optional)
      type: object
      fields:
      - name: tag
        label: 'Colour: capture, formation or survival'
        type: string
      - name: title
        label: Step title
        type: string
      - name: text
        label: Step text
        type: text
      list: true
    - name: bullets
      label: Bulleted list (optional)
      type: text
      list: true
    - name: equations
      label: Equations (optional)
      type: object
      fields:
      - name: tex
        label: Equation as LaTeX
        type: text
      - name: text
        label: Plain-language line under the equation
        type: text
      list: true
    - name: after
      label: Paragraphs after the equations
      type: text
      list: true
    list: true
  - name: references
    label: References
    type: text
    list: true
- name: projects
  label: Projects
  type: file
  path: data/projects.json
  format: json
  fields:
  - name: intro_title
    label: Overview heading
    type: string
  - name: intro
    label: Overview text
    type: text
  - name: research_projects_title
    label: Research projects heading
    type: string
  - name: research_projects
    label: Research projects
    type: object
    fields:
    - name: id
      label: Anchor id (kewpie3 or fusion)
      type: string
    - name: title
      label: Title
      type: string
    - name: status
      label: Status
      type: string
    - name: topics
      label: Topic line
      type: string
    - name: paragraphs
      label: Paragraphs
      type: text
      list: true
    - name: equations_title
      label: Equations block heading (optional)
      type: string
    - name: equations_summary
      label: Equations toggle text (optional, default Show the equations)
      type: string
    - name: equations
      label: Equations (optional)
      type: object
      fields:
      - name: tex
        label: Equation as LaTeX (for example \frac{a}{b})
        type: text
      - name: text
        label: Plain-language line under the equation
        type: text
      list: true
    - name: figures
      label: Figures
      type: object
      fields:
      - name: image
        label: Image path (upload under assets/figures)
        type: string
      - name: full
        label: Large version for click-to-enlarge (optional)
        type: string
      - name: width
        label: Width in pixels
        type: string
      - name: height
        label: Height in pixels
        type: string
      - name: alt
        label: Alt text (describe the figure)
        type: text
      - name: heading
        label: Group heading (optional; starts a new group, for example Comparison with data)
        type: string
      - name: lead
        label: One-line introduction to the group (optional)
        type: string
      - name: caption
        label: Caption
        type: string
      - name: source
        label: Source link (optional)
        type: string
      list: true
    list: true
  - name: software
    label: Software and tools
    type: object
    fields:
    - name: title
      label: Heading
      type: string
    - name: text
      label: Text
      type: text
    - name: items
      label: Tools
      type: string
      list: true
- name: data-engineering
  label: Data Science, ML and Engineering
  type: file
  path: data/data-engineering.json
  format: json
  fields:
  - name: intro_title
    label: Overview heading
    type: string
  - name: intro
    label: Opening statement
    type: text
  - name: programme
    label: Programme
    type: object
    fields:
    - name: title
      label: Title
      type: string
    - name: subtitle
      label: Subtitle
      type: string
    - name: text
      label: Text
      type: text
    - name: skills
      label: Skills
      type: string
      list: true
    - name: note
      label: Note on fictional client scenarios
      type: text
  - name: upcoming_title
    label: Upcoming heading
    type: string
  - name: upcoming
    label: Upcoming projects (teaser cards)
    type: object
    fields:
    - name: status
      label: Marker (for example Coming soon)
      type: string
    - name: name
      label: Name
      type: string
    - name: tagline
      label: One-line purpose
      type: string
    - name: text
      label: Short description
      type: text
    - name: topics
      label: Topics (shown as chips)
      type: string
      list: true
    - name: note
      label: Closing note
      type: text
    list: true
  - name: groups
    label: Groups of projects
    type: object
    fields:
    - name: id
      label: Anchor id (pipelines, retrieval or analysis)
      type: string
    - name: title
      label: Group heading
      type: string
    - name: projects
      label: Projects in this group
      type: object
      fields:
      - name: title
        label: Title
        type: string
      - name: figures
        label: Figures from the project repository
        type: object
        fields:
        - name: image
          label: Image path (upload under assets/figures)
          type: string
        - name: full
          label: Large version for click-to-enlarge (optional)
          type: string
        - name: width
          label: Width in pixels
          type: string
        - name: height
          label: Height in pixels
          type: string
        - name: alt
          label: Alt text (describe the figure)
          type: text
        - name: heading
          label: Group heading (optional; starts a new group, for example Comparison with data)
          type: string
        - name: lead
          label: One-line introduction to the group (optional)
          type: string
        - name: caption
          label: Caption
          type: string
        - name: source
          label: Source link (repository file)
          type: string
        list: true
      - name: topics
        label: Topic line
        type: string
      - name: scenario
        label: Scenario note (fictional client)
        type: string
      - name: sections
        label: Description sections
        type: object
        fields:
        - name: label
          label: Label (Problem, Approach, Technical implementation, Validation, Outcome)
          type: string
        - name: text
          label: Text
          type: text
        list: true
      - name: repo
        label: GitHub link
        type: string
      list: true
    list: true
  - name: tools_title
    label: Technical areas heading
    type: string
  - name: tool_groups
    label: Technical areas
    type: object
    fields:
    - name: label
      label: Area
      type: string
    - name: items
      label: Technologies
      type: string
    list: true
  - name: footnote
    label: Note at the end
    type: text
- name: publications
  label: Publications
  type: file
  path: data/publications.json
  format: json
  fields:
  - name: filters
    label: Year filter buttons
    type: object
    fields:
    - name: id
      label: Filter id
      type: string
    - name: label
      label: Button text
      type: string
    list: true
  - name: groups
    label: Groups
    type: object
    fields:
    - name: id
      label: Anchor id (used by homepage links)
      type: string
    - name: title
      label: Group title
      type: string
    - name: note
      label: Note
      type: string
    - name: items
      label: Entries
      type: object
      fields:
      - name: tag
        label: Filter id (2026, 2024, 2023, earlier or pending)
        type: string
      - name: text
        label: Reference text
        type: text
        description: Text supports **bold**, *italic*, ^superscript^ and [link text](address).
      - name: links
        label: Links to the paper or preprint
        type: object
        fields:
        - name: label
          label: Link text (for example Paper, DOI, arXiv, Preprint)
          type: string
        - name: url
          label: Address (only a real, checked address)
          type: string
        list: true
      list: true
    list: true
  - name: home
    label: Selected publications on the home page
    type: object
    fields:
    - name: label
      label: Label (year)
      type: string
    - name: text
      label: Reference text
