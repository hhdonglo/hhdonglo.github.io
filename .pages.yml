  path: data/pages/contact.json
  format: json
  fields:
  - name: title
    label: Page title
    type: string
  - name: subtitle
    label: Subtitle under the title
    type: string
  - name: sections
    label: Sections
    type: object
    fields: *id002
    list: true
  description: Use {email} in a button link or text to insert the email address from Site settings.
- name: site
  label: Site settings (contact details, footer, profile links)
  type: file
  path: data/site.json
  format: json
  fields:
  - name: name
    label: Name in the footer
    type: string
  - name: field
    label: Field line in the footer
    type: string
  - name: email
    label: Email
    type: string
  - name: email_alt
    label: Second email
    type: string
  - name: phone_display
    label: Phone as shown
