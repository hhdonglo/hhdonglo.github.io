  - name: office
    label: Office
    type: string
  - name: footer_position
    label: Position line in the footer
    type: string
  - name: banner_areas
    label: Home banner line
    type: string
  - name: banner_field
    label: Banner line on other pages
    type: string
  - name: footer_note
    label: Footer note
