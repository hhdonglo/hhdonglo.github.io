# Builds the Class Manager desktop app (class-manager/desktop) for macOS, Windows and Linux.
# The installers appear under the run's "Artifacts". This workflow does not touch the website.
name: Class Manager app

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also put the installers in a draft GitHub Release, for example class-manager-v0.1.0 (leave empty to only build)"
        required: false
        default: ""
      notes:
        description: "Extra sentence for the release notes (optional)"
        required: false
        default: ""
  push:
    paths:
      - "class-manager/**"
      - ".github/workflows/class-manager-app.yml"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
            name: macOS
          - os: windows-latest
            target: --win
            name: Windows
          - os: ubuntu-latest
            target: --linux
            name: Linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: class-manager/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Test the class statistics
        run: npm test
      - name: Build installer (unsigned)
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Class Manager for ${{ matrix.name }}
          path: |
            class-manager/desktop/dist/*.dmg
            class-manager/desktop/dist/*.exe
            class-manager/desktop/dist/*.AppImage
          if-no-files-found: error

  release:
    # Always a draft: the Beta is sent on request, so releases are never public.
    # The download page no longer links to releases: the Beta is sent on request. Keep releases as drafts (not public).
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.release, 'class-manager-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          sparse-checkout: class-manager/desktop/README.txt
          sparse-checkout-cone-mode: false
          path: src
      - name: Add the instructions next to the installers
        run: cp src/class-manager/desktop/README.txt installers/Class-Manager-README.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
          EXTRA: ${{ inputs.notes }}
        run: |
          ls -l installers
          gh release create "${TAG}" installers/* \
            --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --draft \
            --title "Class Manager ${TAG#class-manager-v}" \
            --notes "Installers for Windows, macOS and Linux. Installation and instructions are in Class-Manager-README.txt; the installers are not signed. Beta: not yet fully tested. ${EXTRA}"
